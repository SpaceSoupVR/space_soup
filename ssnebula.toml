# SSNebula configuration. Lint levels: allow, warn, deny.
[lints]
# Free functions are the shape of the renderer, math and asset helper modules.
floating_function = "allow"
# Raw wgpu/windowing FFI calls: each unsafe block wraps one call on a handle the caller owns.
unsafe_without_safety = "allow"
# Remaining unwrap/expect guard invariants established a few lines earlier.
unwrap_used = "allow"
# Render passes, shader setup and examples are long linear sequences that read top to bottom.
long_function = "allow"
deep_nesting = "allow"
# GPU pipeline setup takes many explicit resources; bundling them would change public signatures.
too_many_parameters = "allow"
wide_type = "allow"
# 548 vague names remain: ~464 single-letter bindings in colour, vector and shader maths (h, c, a, b,
# lerp factors), the rest `holds`/`it` locals and numbered values like `sigma2`. Renaming them by hand
# across 99 files is a separate pass; no letter table is used to fake it.
vague_name = "allow"
# `use super::*` in test modules is the standard way to reach the code under test.
wildcard_import = "allow"
# Interior-mutable renderer handles: setters take &self on a shared handle that other repos call.
setter_receiver = "allow"
# Renderers keep their impl blocks next to the section of the pipeline they serve (cfg-gated for xr).
split_impl = "allow"
# Public XR session method other repos call; no per-item exemption exists and renaming it would break them.
vague_verb = "allow"
# Renderer pipelines keep one pass per file; splitting 6000-line pipelines is a separate refactor.
long_file = "allow"
# `CaveClass` is public API other repos name; renaming it would break them.
type_suffix = "allow"

[limits]
function_lines = 60
file_lines = 800
parameters = 5
nesting = 4
struct_fields = 12
enum_variants = 24
doc_lines = 8
comment_run = 4
comment_percent = 50

[names]
short_allowed = [
    "x",
    "y",
    "z",
    "w",
    "i",
    "j",
    "k",
    "n",
    "t",
    "u",
    "v",
]
free_functions = ["main"]
banned = []

[clippy]
enabled = true
warn = [
    "clippy::all",
    "clippy::pedantic",
    "clippy::dbg_macro",
]
allow = [
    "clippy::module_name_repetitions",
    "clippy::must_use_candidate",
    "clippy::missing_errors_doc",
    "clippy::missing_panics_doc",
    "clippy::too_many_lines",
    "clippy::too_many_arguments",
    "clippy::wildcard_imports",
    "clippy::cast_precision_loss",
    "clippy::cast_possible_truncation",
    "clippy::cast_sign_loss",
    "clippy::cast_possible_wrap",
    # Project-wide exemptions: shader and GPU maths compares exact floats in tests and writes
    # long numeric constants and wgpu descriptor structs the pedantic suggestions only obscure.
    "clippy::float_cmp",
    "clippy::default_trait_access",
    "clippy::unreadable_literal",
    "clippy::items_after_statements",
    "clippy::many_single_char_names",
    "clippy::similar_names",
    "clippy::chunks_exact_to_as_chunks",
    # Indexed loops over parallel GPU buffers and grids read clearer than zipped iterators.
    "clippy::neg_cmp_op_on_partial_ord",
    "clippy::manual_clamp",
    "clippy::used_underscore_binding",
    "clippy::return_self_not_must_use",
    "clippy::match_same_arms",
    "clippy::option_option",
    # WGSL source is assembled from nested format! blocks and per-index repeats; the pieces stay
    # separate so each block reads as the shader text it produces.
    "clippy::format_in_format_args",
    "clippy::format_collect",
    "clippy::large_types_passed_by_value",
    "clippy::case_sensitive_file_extension_comparisons",
    "clippy::needless_range_loop",
    "clippy::needless_pass_by_value",
    "clippy::type_complexity",
    "clippy::format_push_string",
    "clippy::struct_excessive_bools",
    "clippy::struct_field_names",
    "clippy::field_reassign_with_default",
    "clippy::unused_self",
    "clippy::assertions_on_constants",
]
